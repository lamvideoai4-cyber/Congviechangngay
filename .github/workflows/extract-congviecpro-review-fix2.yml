name: Extract congviecpro-review-fix2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        run: |
          set -e
          rm -rf congviecpro-review-fix2
          mkdir -p congviecpro-review-fix2
          unzip -q -o congviecpro-review-fix2.zip -d congviecpro-review-fix2
          find congviecpro-review-fix2 -type f | wc -l

      - name: Commit extracted files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add congviecpro-review-fix2
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
            exit 0
          fi
          git commit -m "Extract congviecpro-review-fix2 project"
          git push origin main
