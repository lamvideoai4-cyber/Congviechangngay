name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q CongViecHangNgay_GitHub_v2_UPLOAD.zip -d project

          echo "android.useAndroidX=true" > project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.congviechangngay"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.congviechangngay"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2025.01.00"))
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.core:core-ktx:1.15.0")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF   

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check project
        working-directory: project
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "App:"
          ls -la app
          echo "Gradle files:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CongViecHangNgay-v2-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
